name: Validate website source

on:
  push:
    branches:
      - "**"
    paths:
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "favicon.svg"
      - ".github/workflows/validate-site.yml"
  pull_request:
    paths:
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "favicon.svg"
      - ".github/workflows/validate-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate HTML structure, local links, and required sections
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("index.html").read_text(encoding="utf-8")
          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids, self.links, self.title_text = set(), [], []
                  self.title_open = self.title_seen = False
                  self.html_seen = self.head_seen = self.body_seen = False
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html": self.html_seen = True
                  if tag == "head": self.head_seen = True
                  if tag == "body": self.body_seen = True
                  if "id" in attrs:
                      if attrs["id"] in self.ids: self.errors.append(f"Duplicate id: {attrs['id']}")
                      self.ids.add(attrs["id"])
                  if tag == "a" and attrs.get("href"): self.links.append(attrs["href"])
                  if tag == "title": self.title_open = self.title_seen = True
              def handle_endtag(self, tag):
                  if tag == "title": self.title_open = False
              def handle_data(self, data):
                  if self.title_open: self.title_text.append(data)
          parser = PageParser()
          parser.feed(source)
          parser.close()
          assert parser.html_seen and parser.head_seen and parser.body_seen, "Missing HTML structure"
          assert parser.title_seen and "".join(parser.title_text).strip(), "Missing page title"
          assert 'name="viewport"' in source, "Missing mobile viewport"
          for required in ("features", "plans", "updates", "download", "purchase", "faq"):
              assert f'id="{required}"' in source, f"Missing required section: {required}"
          for action in ("Free Download", "Buy Licence", "Buy Direct"):
              assert action in source, f"Missing required action: {action}"
          assert "15 minutes" in source, "Missing 15-minute trial explanation"
          for href in parser.links:
              if href.startswith("#") and href != "#":
                  assert href[1:] in parser.ids, f"Broken in-page link: {href}"
              elif not href.startswith(("https://", "http://", "mailto:")):
                  local_target = href.split("#", 1)[0]
                  if local_target:
                      assert Path(local_target).is_file(), f"Missing local link target: {href}"
          assert not parser.errors, "; ".join(parser.errors)
          for page_name in ("privacy.html", "terms.html"):
              page = Path(page_name).read_text(encoding="utf-8")
              assert "<html" in page and "<title>" in page and 'name="viewport"' in page, f"Incomplete page: {page_name}"
          assert Path("favicon.svg").is_file(), "Missing favicon.svg"
          print(f"Website source validation passed: {len(parser.ids)} IDs, {len(parser.links)} links, required actions and legal pages present.")
          PY
